spring.application.name=meuimovel-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true

# Impede exposição de detalhes internos da API
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
spring.web.error.include-message=never


# ============================================
# SEGURANCA - SUPABASE AUTH / JWT
# ============================================

# Identifica quem emitiu o token JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_URL}/auth/v1

# Endpoint publico das chaves de verificacao
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_URL}/auth/v1/.well-known/jwks.json

# Aceita exclusivamente assinaturas ES256
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

# Exige a audiencia de usuario autenticado
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
